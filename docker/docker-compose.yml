# iTop CMDB 基础设施栈（2026-11-20）
# 版本基准：jolleykong/iTop tag:3.3.0-1（用户定稿为默认版本）
# 端口：8081（宿主，避开 itops-frontend 8080）；DB 仅 docker 内网，不暴露宿主端口
services:
  db:
    image: mariadb:10.11
    container_name: itop-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "ItopDb#2026"
      MARIADB_DATABASE: itop
      MARIADB_USER: itop
      MARIADB_PASSWORD: "ItopDb#2026"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 须大于 web 侧 upload_max_filesize（64M），iTop setup 检查项
      - --max_allowed_packet=128M
    volumes:
      - itop-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: itop-web:3.3.0-1
    container_name: itop-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - itop-conf:/var/www/html/conf
      - itop-data:/var/www/html/data
      - itop-log:/var/www/html/log
      # env-production 是 setup 编译的数据模型缓存，必须持久化（否则重建容器丢失）
      - ./env-production:/var/www/html/env-production

  # 一次性供给：iTop 原生 MetaModel API 建 Organization + 3 个 Synchro Data Source
  # （幂等，存在即跳过；重跑：docker compose up provision）
  provision:
    image: itop-web:3.3.0-1
    container_name: itop-provision
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - itop-conf:/var/www/html/conf
      - itop-data:/var/www/html/data
      - itop-log:/var/www/html/log
      - ./env-production:/var/www/html/env-production
      - ./cmdb-sync:/var/www/html/cmdb-sync:ro
    command:
      - php
      - /var/www/html/cmdb-sync/provision_ds.php
      - --auth_user=${ITOP_USER:-admin}
      - --auth_pwd=${ITOP_ADMIN_PWD:-}
      - --org=${CMDB_ORG:-ITOPS}

  # Zabbix → iTop CMDB 同步（发现与资产登记，2026-11-20）
  # 凭据与配置全部来自 /opt/itop/.env（chmod 600）：
  #   ZBX_URL / ZBX_TOKEN / ITOP_USER / ITOP_ADMIN_PWD / CMDB_ORG / SYNC_INTERVAL_SECONDS
  # 首次启动自动创建 Organization + 3 个 Synchro Data Source（provision.py）
  sync:
    build:
      context: ./cmdb-sync
    image: itop-sync:1.0
    container_name: itop-sync
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZBX_URL: "${ZBX_URL}"
      ZBX_TOKEN: "${ZBX_TOKEN}"
      ITOP_URL: "http://itop-web:80"
      ITOP_USER: "${ITOP_USER:-admin}"
      ITOP_ADMIN_PWD: "${ITOP_ADMIN_PWD:-}"
      CMDB_ORG: "${CMDB_ORG:-ITOPS}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-14400}"
      ITOP_DB_HOST: itop-db
      ITOP_DB_NAME: itop
      ITOP_DB_USER: itop
      ITOP_DB_PASS: "ItopDb#2026"

volumes:
  itop-db-data:
  itop-conf:
  itop-data:
  itop-log:
