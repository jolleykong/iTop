# iTop CMDB 基础设施栈（2026-11-20，2026-11-26 改为外置 MariaDB）
# 版本基准：jolleykong/iTop tag:3.3.0-1（用户定稿为默认版本）
# 端口：8081（宿主，避开 itops-frontend 8080）
#
# 数据库：默认连外置 MariaDB（aiops-mariadb，与 aiops 共用一个实例、各自独立库）。
#   iTop 与 aiops 共用实例的前提是「各自独立的 database + 独立的 user」，
#   两边数据互不可见，只是少维护一个数据库进程。
#   历史内置栈保留在 `bundled-db` profile 下，仅作回滚用：
#       docker compose --profile bundled-db up -d db
#   iTop 侧连接信息记在 conf/production/config-itop.php（itop-conf 卷持久化），
#   sync 侧走环境变量 ITOP_DB_*（见 .env）。
#
# 镜像 tag 说明：itop-web 本轮无代码变更，沿用 kkv-3.1.0；
#   itop-sync 增加了 ITOP_DB_PORT 支持与口令入参清理，升到 kkv-3.1.1。
services:
  # ── 回滚用：内置 MariaDB（默认不启动） ─────────────────────────
  # 启用后需把 config-itop.php 的 db_host 改回 itop-db
  db:
    image: mariadb:10.11
    container_name: itop-db
    restart: unless-stopped
    profiles: ["bundled-db"]
    environment:
      # 口令统一来自 docker/.env（不入库）；缺失时 compose 直接报错，避免默认弱口令
      MARIADB_ROOT_PASSWORD: "${ITOP_DB_ROOT_PASSWORD:?请在 docker/.env 配置 ITOP_DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: itop
      MARIADB_USER: itop
      MARIADB_PASSWORD: "${ITOP_DB_PASS:?请在 docker/.env 配置 ITOP_DB_PASS}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 须大于 web 侧 upload_max_filesize（64M），iTop setup 检查项
      - --max_allowed_packet=128M
    volumes:
      - itop-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: itop-web:kkv-3.1.0
    container_name: itop-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - itop-conf:/var/www/html/conf
      - itop-data:/var/www/html/data
      - itop-log:/var/www/html/log
      # env-production 是 setup 编译的数据模型缓存，必须持久化（否则重建容器丢失）
      - ./env-production:/var/www/html/env-production

  # 一次性供给：iTop 原生 MetaModel API 建 Organization + 3 个 Synchro Data Source
  # （幂等，存在即跳过；重跑：docker compose up provision）
  provision:
    image: itop-web:kkv-3.1.0
    container_name: itop-provision
    restart: "no"
    volumes:
      - itop-conf:/var/www/html/conf
      - itop-data:/var/www/html/data
      - itop-log:/var/www/html/log
      - ./env-production:/var/www/html/env-production
      - ./cmdb-sync:/var/www/html/cmdb-sync:ro
    command:
      - php
      - /var/www/html/cmdb-sync/provision_ds.php
      - --auth_user=${ITOP_USER:-admin}
      - --auth_pwd=${ITOP_ADMIN_PWD:-}
      - --org=${CMDB_ORG:-ITOPS}

  # Zabbix → iTop CMDB 同步（发现与资产登记，2026-11-20）
  # 凭据与配置全部来自 /opt/itop/.env（chmod 600）：
  #   ZBX_URL / ZBX_TOKEN / ITOP_USER / ITOP_ADMIN_PWD / CMDB_ORG / SYNC_INTERVAL_SECONDS
  # 首次启动自动创建 Organization + 3 个 Synchro Data Source（provision.py）
  sync:
    build:
      context: ./cmdb-sync
    image: itop-sync:kkv-3.1.1
    container_name: itop-sync
    restart: unless-stopped
    environment:
      ZBX_URL: "${ZBX_URL}"
      ZBX_TOKEN: "${ZBX_TOKEN}"
      ITOP_URL: "http://itop-web:80"
      ITOP_USER: "${ITOP_USER:-admin}"
      ITOP_ADMIN_PWD: "${ITOP_ADMIN_PWD:-}"
      CMDB_ORG: "${CMDB_ORG:-ITOPS}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-14400}"
      SYNC_HTTP_TIMEOUT: "${SYNC_HTTP_TIMEOUT:-600}"
      # 外置 MariaDB（默认）；回滚到内置栈时把 .env 的 ITOP_DB_HOST 设为 itop-db
      ITOP_DB_HOST: "${ITOP_DB_HOST:-aiops-mariadb}"
      ITOP_DB_PORT: "${ITOP_DB_PORT:-3306}"
      ITOP_DB_NAME: "${ITOP_DB_NAME:-itop}"
      ITOP_DB_USER: "${ITOP_DB_USER:-itop}"
      ITOP_DB_PASS: "${ITOP_DB_PASS:?请在 docker/.env 配置 ITOP_DB_PASS}"
    volumes:
      # 宿主 SN 映射表可热更新（改了不用重建镜像）；镜像内已内置一份默认副本
      - ./cmdb-sync/vc_sn_map.json:/app/vc_sn_map.json:ro

volumes:
  itop-db-data:
  itop-conf:
  itop-data:
  itop-log:
